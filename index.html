<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İslam Royale & Din Reels</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #121212; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { width: 400px; height: 750px; background: #1e1e2e; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; border: 4px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .tab-buttons { display: flex; background: #11111b; }
        .tab-btn { flex: 1; padding: 15px; border: none; background: transparent; color: #888; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { color: #4ba3e3; border-bottom: 3px solid #4ba3e3; background: #181825; }
        .tab-content { display: none; flex: 1; flex-direction: column; position: relative; }
        .tab-content.active { display: flex; }
        
        /* OYUN ALANI */
        .game-header { background: #313244; padding: 10px; text-align: center; }
        .elixir-bar-bg { width: 100%; height: 15px; background: #45475a; border-radius: 10px; overflow: hidden; margin-top: 5px; }
        .elixir-bar-fill { width: 30%; height: 100%; background: #cba6f7; transition: width 0.3s; }
        .arena { flex: 1; background: #2e7d32; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; position: relative; }
        .tower { width: 60px; height: 60px; background: #89b4fa; border: 3px solid #11111b; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-weight: bold; margin: 0 auto; }
        .enemy-tower { background: #f38ba8; }
        .cards-container { display: flex; gap: 10px; justify-content: center; background: #11111b; padding: 15px; }
        .card { width: 80px; height: 100px; background: #cba6f7; border-radius: 8px; color: #111; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; font-size: 12px; font-weight: bold; text-align: center; padding: 5px; }
        .card:hover { transform: scale(1.05); }

        /* SORU MODALI */
        .modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); flex-direction: column; justify-content: center; align-items: center; padding: 20px; z-index: 10; }
        .modal-content { background: #313244; padding: 20px; border-radius: 12px; text-align: center; width: 100%; }
        .modal-btn { display: block; width: 100%; padding: 10px; margin: 8px 0; background: #45475a; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .modal-btn:hover { background: #585b70; }

        /* INSTAGRAM REELS ALANI */
        .reels-container { flex: 1; background: #000; position: relative; display: flex; justify-content: center; align-items: center; }
        .video-placeholder { text-align: center; color: #888; }
        .reels-actions { position: absolute; right: 15px; bottom: 80px; display: flex; flex-direction: column; gap: 20px; }
        .action-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 18px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="tab-buttons">
        <button class="tab-btn active" onclick="switchTab('game')">⚔️ İslam Royale</button>
        <button class="tab-btn" onclick="switchTab('reels')">📱 Din Reels</button>
    </div>

    <!-- OYUN SEKMESİ -->
    <div id="game" class="tab-content active">
        <div class="game-header">
            <div>İlim İksiri: <span id="elixir-count">3</span>/10</div>
            <div class="elixir-bar-bg"><div id="elixir-fill" class="elixir-bar-fill"></div></div>
        </div>
        
        <div class="arena">
            <div class="tower enemy-tower">Rakip<br><span id="enemy-hp">1000</span></div>
            <div class="tower">Kulem<br><span id="my-hp">1000</span></div>
        </div>

        <div class="cards-container">
            <div class="card" onclick="playCard('Sıdk Saldırısı', 3)">⚔️ Sıdk<br>(3 İksir)</div>
            <div class="card" onclick="playCard('Fetanet Zekası', 4)">🧠 Fetanet<br>(4 İksir)</div>
            <div class="card" onclick="playCard('İlahi Kitap', 5)">📖 Kitaplar<br>(5 İksir)</div>
        </div>

        <!-- Soru Penceresi -->
        <div id="quiz-modal" class="modal">
            <div class="modal-content">
                <h3 id="quiz-question" style="margin-bottom:15px;">Soru buraya gelecek</h3>
                <div id="quiz-options"></div>
            </div>
        </div>
    </div>

    <!-- REELS SEKMESİ -->
    <div id="reels" class="tab-content">
        <div class="reels-container">
            <!-- Arkadaşının videosunu koyacağın alan -->
            <video id="reels-video" width="100%" height="100%" controls style="object-fit: cover;">
                <source src="videos/video1.mp4" type="video/mp4">
                Tarayıcınız video etiketini desteklemiyor.
            </video>
            
            <div class="reels-actions">
                <button class="action-btn">❤️</button>
                <button class="action-btn">💬</button>
                <button class="action-btn">✈️</button>
            </div>
        </div>
    </div>
</div>

<script>
    let elixir = 3;
    let pendingCard = null;

    const questions = [
        { q: "Peygamberlerin 'Doğru olmak' anlamına gelen sıfatı hangisidir?", options: ["Sıdk", "Fetanet", "İsmet", "Tebliğ"], answer: 0 },
        { q: "Hz. Davud (a.s.) hangi ilahi kitap gönderilmiştir?", options: ["Tevrat", "Zebur", "İncil", "Kur'an-ı Kerim"], answer: 1 },
        { q: "Peygamberlerin 'Akıllı ve zeki olmaları' hangi sıfatlarıdır?", options: ["Emanet", "Fetanet", "İsmet", "Sıdk"], answer: 1 }
    ];

    // İksir Dolumu
    setInterval(() => {
        if(elixir < 10) {
            elixir++;
            updateElixir();
        }
    }, 2000);

    function updateElixir() {
        document.getElementById('elixir-count').innerText = elixir;
        document.getElementById('elixir-fill').style.width = (elixir * 10) + '%';
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        
        event.target.classList.add('active');
        document.getElementById(tabId).classList.add('active');
    }

    function playCard(cardName, cost) {
        if(elixir < cost) {
            alert("Yeterli İlim İksiri yok!");
            return;
        }

        pendingCard = { name: cardName, cost: cost };
        showQuestion();
    }

    function showQuestion() {
        const randomQ = questions[Math.floor(Math.random() * questions.length)];
        document.getElementById('quiz-question').innerText = randomQ.q;
        
        const optionsDiv = document.getElementById('quiz-options');
        optionsDiv.innerHTML = '';
        
        randomQ.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'modal-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index === randomQ.answer);
            optionsDiv.appendChild(btn);
        });

        document.getElementById('quiz-modal').style.style.display = 'flex';
        document.getElementById('quiz-modal').style.display = 'flex';
    }

    function checkAnswer(isCorrect) {
        document.getElementById('quiz-modal').style.display = 'none';
        
        if(isCorrect) {
            elixir -= pendingCard.cost;
            updateElixir();
            let enemyHp = document.getElementById('enemy-hp');
            enemyHp.innerText = Math.max(0, parseInt(enemyHp.innerText) - 250);
            alert("Doğru Cevap! " + pendingCard.name + " hamlesi yapıldı!");
        } else {
            alert("Yanlış cevap! Kart oynanamadı.");
        }
    }
</script>

</body>
</html>
