<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Din Reels</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Tam Instagram Reels Kaydırma Mantığı */
        .reels-container {
            height: calc(100% - 60px);
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
        }
        .reels-wrapper {
            height: 100%;
            scroll-snap-align: start;
            position: relative;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .reels-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="reels-container">
            
            <!-- 1. Video -->
            <div class="reels-wrapper">
                <video class="reels-video" controls loop muted>
                    <source src="videos/video1.mp4" type="video/mp4">
                    Video 1 yüklenemedi.
                </video>
                <div class="reels-side-bar">
                    <div class="side-icon">❤️</div>
                    <div class="side-icon">💬</div>
                    <div class="side-icon">✈️</div>
                </div>
            </div>
